id: js.fs.file-access-fn
version: 1
kind: sink
lang: javascript
framework: fs
grammar: tree-sitter-javascript@0.25 / tree-sitter-typescript@0.23 (javascript, typescript, tsx)
captures: { call: "@call", method: "@method", args: "@args" }
category: path_traversal
cwe: [CWE-22]
severityHint: high
api: "{importPath}.{method}"
match: { receiverImportAny: [fs, fs/promises, fs-extra, graceful-fs], minArgs: 1 }
