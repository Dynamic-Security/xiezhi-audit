# business-sensitive point: ORM / repository lookups of one record by id (Mongoose, Sequelize, Prisma, TypeORM) where an ownership (IDOR) check must hold.
id: js.business.by-id
version: 1
kind: sink
lang: javascript
framework: business
grammar: tree-sitter-javascript@0.25 / tree-sitter-typescript@0.23 (javascript, typescript, tsx)
