category: authz_object
cwe: [CWE-639]
severityHint: medium
api: "按 ID 访问资源 {method}(…)"
match: { notReceiverTextPattern: '^(req|res|ctx|document|window|\$|_|lodash|Array|Object|arr|list|items|rows|result|results|data|this)$', minArgs: 1 }
post: js_sink_by_id
