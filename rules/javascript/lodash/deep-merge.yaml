# Prototype pollution: deep merge / set of request data.
id: js.lodash.deep-merge
version: 1
kind: sink
lang: javascript
framework: lodash
grammar: tree-sitter-javascript@0.25 / tree-sitter-typescript@0.23 (javascript, typescript, tsx)
captures: { call: "@call", method: "@method", receiver: "@receiver", args: "@args" }
category: other
cwe: [CWE-1321]
severityHint: medium
api: "{receiver}.{method}(request data)"
match: { receiverTextPattern: '^(_|lodash)$', minArgs: 2 }
post: js_sink_request_arg
