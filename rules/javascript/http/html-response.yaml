# HTML assembled by concatenation / interpolation and written to the response.
id: js.http.html-response
version: 1
kind: sink
lang: javascript
framework: http
grammar: tree-sitter-javascript@0.25 / tree-sitter-typescript@0.23 (javascript, typescript, tsx)
captures: { call: "@call", method: "@method", receiver: "@receiver", args: "@args" }
category: xss
cwe: [CWE-79]
severityHint: medium
api: "{receiver}.{method}(html)"
match: { receiverTextPattern: '^(res|response|reply)$', minArgs: 1 }
post: js_sink_html_concat
