# Express res.sendFile / res.download, Fastify reply.sendFile.
id: js.http.send-file
version: 1
kind: sink
lang: javascript
framework: http
grammar: tree-sitter-javascript@0.25 / tree-sitter-typescript@0.23 (javascript, typescript, tsx)
captures: { call: "@call", method: "@method", receiver: "@receiver", args: "@args" }
category: path_traversal
cwe: [CWE-22]
severityHint: high
api: "{receiver}.{method}"
match: { receiverTextPattern: '^(res|response|reply|ctx\.res)$', minArgs: 1 }
