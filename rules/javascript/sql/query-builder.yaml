# TypeORM / MikroORM query builders: a condition string built by interpolation or concatenation.
id: js.sql.query-builder
version: 1
kind: sink
lang: javascript
framework: sql
grammar: tree-sitter-javascript@0.25 / tree-sitter-typescript@0.23 (javascript, typescript, tsx)
captures: { call: "@call", method: "@method", receiver: "@receiver", args: "@args" }
category: sqli
cwe: [CWE-89]
severityHint: high
api: "QueryBuilder.{method}"
match: { receiverTextPattern: 'createQueryBuilder|(^|\.)(qb|queryBuilder|builder)$', minArgs: 1 }
post: js_sink_concat_only
