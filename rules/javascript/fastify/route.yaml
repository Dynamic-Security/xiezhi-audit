# Fastify: fastify.get(path, [opts], handler), fastify.route({ method, url, handler, preHandler }),
# register(plugin, { prefix }) and addHook('onRequest' | 'preHandler', …).
id: js.fastify.route
version: 1
kind: entrypoint
lang: javascript
framework: fastify
grammar: tree-sitter-javascript@0.25 / tree-sitter-typescript@0.23 (javascript, typescript, tsx)
captures: { call: "@call", router: "@router", verb: "@verb", args: "@args" }
match: { requiresImportAny: [fastify, fastify-plugin] }
post: js_router_route
