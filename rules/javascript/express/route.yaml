# Express routes: app.get/post/…(path, ...middlewares, handler), express.Router(), r.route('/p').get(h),
# prefixes from app.use('/prefix', router) in the file and across files (input context).
id: js.express.route
version: 1
kind: entrypoint
lang: javascript
framework: express
grammar: tree-sitter-javascript@0.25 / tree-sitter-typescript@0.23 (javascript, typescript, tsx)
captures: { call: "@call", router: "@router", verb: "@verb", args: "@args" }
match: { requiresImportAny: [express], notImportAny: [fastify, koa, "@koa/router", koa-router] }
post: js_router_route
