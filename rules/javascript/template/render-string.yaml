# Template engines compiling a non-literal template source (ejs.render, pug.compile, Handlebars.compile, nunjucks.renderString, _.template).
id: js.template.render-string
version: 1
kind: sink
lang: javascript
framework: template
grammar: tree-sitter-javascript@0.25 / tree-sitter-typescript@0.23 (javascript, typescript, tsx)
captures: { call: "@call", method: "@method", receiver: "@receiver", args: "@args" }
category: ssti
cwe: [CWE-1336]
severityHint: high
api: "{importPath}.{method}"
match: { receiverImportAny: [ejs, pug, jade, handlebars, hbs, nunjucks, lodash, underscore, dot, mustache, eta, squirrelly, doT], minArgs: 1 }
post: js_sink_non_literal
