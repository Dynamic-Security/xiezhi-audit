id: js.node.vm
version: 1
kind: sink
lang: javascript
framework: node
grammar: tree-sitter-javascript@0.25 / tree-sitter-typescript@0.23 (javascript, typescript, tsx)
captures: { call: "@call", method: "@method", receiver: "@receiver", args: "@args" }
category: code_injection
cwe: [CWE-94]
severityHint: high
api: "vm.{method}"
match: { receiverImportAny: [vm, vm2, safe-eval] }
