# Egg / Midway `this.ctx.redirect(url)` / `unsafeRedirect(url)` with a non-literal target (egg-security only
# checks `redirect` against `security.domainWhiteList` when one is configured).
id: js.egg.redirect
version: 1
kind: sink
lang: javascript
framework: egg
grammar: tree-sitter-javascript@0.25 / tree-sitter-typescript@0.23 (javascript, typescript, tsx)
captures: { call: "@call", method: "@method", receiver: "@receiver", args: "@args" }
category: open_redirect
cwe: [CWE-601]
severityHint: medium
api: "ctx.{method}"
match: { requiresImportAny: [egg, "@midwayjs/core", "@midwayjs/decorator", "@midwayjs/web", "@midwayjs/koa"], receiverTextPattern: '^(this\.ctx|ctx)$', minArgs: 1 }
post: js_sink_redirect_target
