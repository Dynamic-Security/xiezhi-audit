id: kotlin.ktor.http-client
version: 1
kind: sink
lang: kotlin
framework: ktor
grammar: tree-sitter-kotlin@1.1.0
captures: { call: "@call", method: "@method", receiver: "@receiver", args: "@args", type: "@type" }
category: ssrf
cwe: [CWE-918]
severityHint: high
api: "io.ktor.client.HttpClient#{method}(String)"
match: { receiverTypes: [HttpClient], receiverNamePattern: '(?i)^(http)?client$|HttpClient$', minArgs: 1 }
