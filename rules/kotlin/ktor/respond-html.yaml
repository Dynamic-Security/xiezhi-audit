id: kotlin.ktor.respond-html
version: 1
kind: sink
lang: kotlin
framework: ktor
grammar: tree-sitter-kotlin@1.1.0
captures: { call: "@call", method: "@method", receiver: "@receiver", args: "@args", type: "@type" }
category: xss
cwe: [CWE-79]
severityHint: medium
api: "io.ktor.server.response#{method}(String, ContentType.Text.Html)"
match: { receiverTextPattern: '^call$' }
