# Second pattern: `rest.getForObject<T>(url)` (explicit type arguments parse as comparisons in this grammar).
id: kotlin.spring.rest-template
version: 1
kind: sink
lang: kotlin
framework: libs
grammar: tree-sitter-kotlin@1.1.0
captures: { call: "@call", method: "@method", receiver: "@receiver", args: "@args", type: "@type" }
category: ssrf
cwe: [CWE-918]
severityHint: high
api: "org.springframework.web.client.RestTemplate#{method}(String)"
match: { receiverTypes: [RestTemplate, RestOperations], receiverNamePattern: '(?i)restTemplate|^rest$', minArgs: 1 }
