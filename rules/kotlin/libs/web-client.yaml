id: kotlin.libs.web-client
version: 1
kind: sink
lang: kotlin
framework: libs
grammar: tree-sitter-kotlin@1.1.0
captures: { call: "@call", method: "@method", receiver: "@receiver", args: "@args", type: "@type" }
category: ssrf
cwe: [CWE-918]
severityHint: medium
api: "{receiverType}#{method}(String)"
match: { receiverTypes: [WebClient, RestClient, Builder], receiverNamePattern: '(?i)webClient|restClient|\.(get|post|put|delete|patch|method)\([^)]*\)$|Request\.Builder|builder\(\)', minArgs: 1 }
