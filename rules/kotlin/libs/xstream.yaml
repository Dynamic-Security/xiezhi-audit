id: kotlin.libs.xstream
version: 1
kind: sink
lang: kotlin
framework: libs
grammar: tree-sitter-kotlin@1.1.0
captures: { call: "@call", method: "@method", receiver: "@receiver", args: "@args", type: "@type" }
category: deserialization
cwe: [CWE-502]
severityHint: critical
api: "com.thoughtworks.xstream.XStream#fromXML(String)"
match: { receiverTypes: [XStream], receiverNamePattern: '(?i)xstream', minArgs: 1 }
