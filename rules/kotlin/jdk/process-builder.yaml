id: kotlin.jdk.process-builder
version: 1
kind: sink
lang: kotlin
framework: jdk
grammar: tree-sitter-kotlin@1.1.0
captures: { call: "@call", method: "@method", receiver: "@receiver", args: "@args", type: "@type" }
category: cmdi
cwe: [CWE-78]
severityHint: critical
api: "java.lang.ProcessBuilder#<init>(String[])"
match: { minArgs: 1 }
