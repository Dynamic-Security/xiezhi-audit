# Redirect to a non-constant URL (url_for / reverse targets are skipped).
id: python.web.redirect
version: 1
kind: sink
lang: python
framework: web
grammar: tree-sitter-python@0.25
captures: { call: "@call", method: "@method", receiver: "@receiver", args: "@args" }
category: open_redirect
cwe: [CWE-601]
severityHint: medium
api: "{module}.{method}"
match: { receiverImportAny: [flask, werkzeug.utils, django.shortcuts, django.http, django.http.response, fastapi.responses, starlette.responses], minArgs: 1 }
post: python_redirect
