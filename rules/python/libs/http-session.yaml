# requests.Session / httpx.Client / aiohttp.ClientSession / urllib3.PoolManager instances.
id: python.libs.http-session
version: 1
kind: sink
lang: python
framework: libs
grammar: tree-sitter-python@0.25
captures: { call: "@call", method: "@method", receiver: "@receiver", args: "@args" }
category: ssrf
cwe: [CWE-918]
severityHint: high
api: "{receiver}.{method}"
match: { requiresImportAny: [requests, httpx, aiohttp, urllib3], receiverTypes: [Session, Client, AsyncClient, ClientSession, PoolManager], receiverNamePattern: '(?i)^(self\.)?_?(session|http|client|http_client|sess|pool)$', minArgs: 1 }
