# pickle / marshal / jsonpickle / shelve / dill / joblib deserialization.
id: python.libs.pickle
version: 1
kind: sink
lang: python
framework: libs
grammar: tree-sitter-python@0.25
captures: { call: "@call", method: "@method", receiver: "@receiver", args: "@args" }
category: deserialization
cwe: [CWE-502]
severityHint: critical
api: "{module}.{method}"
match: { receiverImportAny: [pickle, cPickle, _pickle, dill, cloudpickle, marshal, jsonpickle, shelve, joblib], minArgs: 1 }
