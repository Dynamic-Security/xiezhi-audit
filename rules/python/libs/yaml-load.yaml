# yaml.load without SafeLoader / unsafe_load.
id: python.libs.yaml-load
version: 1
kind: sink
lang: python
framework: libs
grammar: tree-sitter-python@0.25
captures: { call: "@call", method: "@method", receiver: "@receiver", args: "@args" }
category: deserialization
cwe: [CWE-502]
severityHint: high
api: "yaml.{method}"
match: { receiverImportAny: [yaml, ruamel.yaml], minArgs: 1 }
post: python_yaml_load
