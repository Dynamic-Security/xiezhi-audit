# Outbound HTTP with a non-constant URL: reqwest::get, ureq, surf, isahc, attohttpc module functions.
id: rust.libs.http-client
version: 1
kind: sink
lang: rust
framework: libs
grammar: tree-sitter-rust@0.24
captures: { call: "@call", method: "@method", receiver: "@receiver", args: "@args" }
category: ssrf
cwe: [CWE-918]
severityHint: high
api: "{receiver}::{method}"
match: { receiverTextPattern: "(^|::)(reqwest|reqwest::blocking|ureq|surf|isahc|attohttpc)$" }
post: rust_nonconst
