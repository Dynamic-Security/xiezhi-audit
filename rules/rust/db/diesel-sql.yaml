# diesel::sql_query / dsl::sql and sea-orm Statement::from_string with SQL text built at runtime.
id: rust.db.diesel-sql
version: 1
kind: sink
lang: rust
framework: db
grammar: tree-sitter-rust@0.24
captures: { call: "@call", method: "@method", receiver: "@receiver", args: "@args" }
category: sqli
cwe: [CWE-89]
severityHint: high
api: "{receiver}::{method}"
match: { receiverTextPattern: "(^|::)(diesel|dsl|Statement)$" }
post: rust_sql
