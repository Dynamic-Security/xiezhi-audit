# html_safe / raw on request data or on strings interpolating unescaped values (XSS outside the view auto-escaping).
id: ruby.web.html-safe
version: 1
kind: sink
lang: ruby
framework: web
grammar: tree-sitter-ruby@0.23
captures: { call: "@call", method: "@method", receiver: "@receiver", args: "@args" }
category: xss
cwe: [CWE-79]
severityHint: medium
api: "{method}"
post: ruby_html_safe
