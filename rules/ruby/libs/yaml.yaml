# YAML.load / Psych.load / unsafe_load of non-constant data (Psych < 4 `load` instantiates arbitrary objects).
id: ruby.libs.yaml
version: 1
kind: sink
lang: ruby
framework: libs
grammar: tree-sitter-ruby@0.23
captures: { call: "@call", method: "@method", receiver: "@receiver", args: "@args" }
category: deserialization
cwe: [CWE-502]
severityHint: high
api: "{receiver}.{method}"
match: { receiverTextPattern: "^(::)?(YAML|Psych)$" }
post: ruby_yaml_load
