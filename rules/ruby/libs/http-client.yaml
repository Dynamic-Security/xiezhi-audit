# Outbound HTTP with a non-constant URL: Net::HTTP, HTTParty, Faraday, RestClient, Excon, http.rb, Typhoeus, HTTPClient, URI.open.
id: ruby.libs.http-client
version: 1
kind: sink
lang: ruby
framework: libs
grammar: tree-sitter-ruby@0.23
captures: { call: "@call", method: "@method", receiver: "@receiver", args: "@args" }
category: ssrf
cwe: [CWE-918]
severityHint: high
api: "{receiver}.{method}"
match: { receiverTextPattern: "^(::)?(Net::HTTP|HTTParty|Faraday|RestClient|RestClient::Request|Excon|HTTP|HTTPX|Typhoeus|Typhoeus::Request|HTTPClient|URI|OpenURI)$" }
post: ruby_http
