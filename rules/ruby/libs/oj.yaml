# Oj.load in object mode (the default) / Oj.object_load.
id: ruby.libs.oj
version: 1
kind: sink
lang: ruby
framework: libs
grammar: tree-sitter-ruby@0.23
captures: { call: "@call", method: "@method", receiver: "@receiver", args: "@args" }
category: deserialization
cwe: [CWE-502]
severityHint: high
api: "Oj.{method}"
match: { receiverTextPattern: "^(::)?Oj$" }
post: ruby_oj_load
