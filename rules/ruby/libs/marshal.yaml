# Marshal.load / restore of non-constant data.
id: ruby.libs.marshal
version: 1
kind: sink
lang: ruby
framework: libs
grammar: tree-sitter-ruby@0.23
captures: { call: "@call", method: "@method", receiver: "@receiver", args: "@args" }
category: deserialization
cwe: [CWE-502]
severityHint: critical
api: "Marshal.{method}"
match: { receiverTextPattern: "^(::)?Marshal$" }
post: ruby_nonconst
