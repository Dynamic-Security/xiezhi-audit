# JSON.load (json_create additions) and JSON.parse(…, create_additions: true).
id: ruby.libs.json-create
version: 1
kind: sink
lang: ruby
framework: libs
grammar: tree-sitter-ruby@0.23
captures: { call: "@call", method: "@method", receiver: "@receiver", args: "@args" }
category: deserialization
cwe: [CWE-502]
severityHint: medium
api: "JSON.{method}"
match: { receiverTextPattern: "^(::)?JSON$" }
post: ruby_json_create
