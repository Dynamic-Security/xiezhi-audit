# Raw SQL on a connection: connection.execute / exec_query / select_all …, Arel.sql, Sequel.lit / DB.run, pg / mysql2 client exec / query — non-constant SQL text.
id: ruby.db.raw-sql
version: 1
kind: sink
lang: ruby
framework: db
grammar: tree-sitter-ruby@0.23
captures: { call: "@call", method: "@method", receiver: "@receiver", args: "@args" }
category: sqli
cwe: [CWE-89]
severityHint: high
api: "{receiver}.{method}(…)"
match: { receiverTextPattern: "(?i)(connection|\\bconn\\b|\\bdb\\b|^Arel$|^Sequel$|client|^pg|mysql|sqlite)" }
post: ruby_raw_sql
