# Kernel command execution: system / exec / spawn with a non-constant command.
id: ruby.stdlib.command
version: 1
kind: sink
lang: ruby
framework: stdlib
grammar: tree-sitter-ruby@0.23
captures: { call: "@call", method: "@method", receiver: "@receiver", args: "@args" }
category: cmdi
cwe: [CWE-78]
severityHint: critical
api: "Kernel#{method}"
post: ruby_nonconst
