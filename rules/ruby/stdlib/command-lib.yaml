# Command execution through Kernel / Process / IO.popen / Open3 / PTY with a non-constant command.
id: ruby.stdlib.command-lib
version: 1
kind: sink
lang: ruby
framework: stdlib
grammar: tree-sitter-ruby@0.23
captures: { call: "@call", method: "@method", receiver: "@receiver", args: "@args" }
category: cmdi
cwe: [CWE-78]
severityHint: critical
api: "{receiver}.{method}"
match: { receiverTextPattern: "^(::)?(Kernel|Process|IO|Open3|PTY)$" }
post: ruby_nonconst
