id: java.libs.snakeyaml
version: 1
kind: sink
lang: java
framework: libs
grammar: tree-sitter-java@0.23
captures: { call: "@call", method: "@method", receiver: "@receiver", args: "@args", type: "@type" }
category: deserialization
cwe: [CWE-502]
severityHint: high
api: "org.yaml.snakeyaml.Yaml#{method}(String)"
match: { receiverTypes: [Yaml], receiverNamePattern: '(?i)yaml', minArgs: 1 }
