id: java.libs.http-client
version: 1
kind: sink
lang: java
framework: libs
grammar: tree-sitter-java@0.23
captures: { call: "@call", method: "@method", receiver: "@receiver", args: "@args", type: "@type" }
category: ssrf
cwe: [CWE-918]
severityHint: medium
api: "{receiverType}#{method}(String)"
match: { receiverTypes: [HttpClient, CloseableHttpClient, OkHttpClient, WebClient, Builder], receiverNamePattern: '(?i)httpClient|okHttp|webClient|Request\.Builder|builder\(\)', minArgs: 1 }
