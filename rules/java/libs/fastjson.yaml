id: java.libs.fastjson
version: 1
kind: sink
lang: java
framework: libs
grammar: tree-sitter-java@0.23
captures: { call: "@call", method: "@method", receiver: "@receiver", args: "@args", type: "@type" }
category: deserialization
cwe: [CWE-502]
severityHint: high
api: "com.alibaba.fastjson.JSON#{method}(String)"
match: { receiverTextPattern: '^(JSON|JSONObject|com\.alibaba\.fastjson\.JSON)$', minArgs: 1 }
