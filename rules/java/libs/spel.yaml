id: java.libs.spel
version: 1
kind: sink
lang: java
framework: libs
grammar: tree-sitter-java@0.23
captures: { call: "@call", method: "@method", receiver: "@receiver", args: "@args", type: "@type" }
category: expression_injection
cwe: [CWE-917]
severityHint: critical
api: "{receiverType}#{method}(String)"
match: { receiverTypes: [SpelExpressionParser, ExpressionParser, Ognl], receiverTextPattern: '^Ognl$', receiverNamePattern: '(?i)parser', minArgs: 1 }
