id: java.jdk.url-connection
version: 1
kind: sink
lang: java
framework: jdk
grammar: tree-sitter-java@0.23
captures: { call: "@call", method: "@method", receiver: "@receiver", args: "@args", type: "@type" }
category: ssrf
cwe: [CWE-918]
severityHint: high
api: "java.net.URL#{method}()"
match: { receiverTypes: [URL], receiverNamePattern: '(?i)url|new URL' }
