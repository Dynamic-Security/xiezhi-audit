id: java.jdk.xml-parse
version: 1
kind: sink
lang: java
framework: jdk
grammar: tree-sitter-java@0.23
captures: { call: "@call", method: "@method", receiver: "@receiver", args: "@args", type: "@type" }
category: xxe
cwe: [CWE-611]
severityHint: high
api: "{receiverType}#{method}(InputSource)"
match: { receiverTypes: [DocumentBuilder, SAXParser, SAXReader, SAXBuilder, XMLInputFactory, Unmarshaller, XMLReader], minArgs: 1 }
