id: java.jdk.nio-files
version: 1
kind: sink
lang: java
framework: jdk
grammar: tree-sitter-java@0.23
captures: { call: "@call", method: "@method", receiver: "@receiver", args: "@args", type: "@type" }
category: path_traversal
cwe: [CWE-22]
severityHint: medium
api: "java.nio.file.{receiver}#{method}(Path)"
match: { receiverTextPattern: '^(Files|Paths|Path|java\.nio\.file\.(Files|Paths|Path))$', minArgs: 1 }
