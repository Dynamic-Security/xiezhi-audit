id: java.jdbc.jdbc-template
version: 1
kind: sink
lang: java
framework: jdbc
grammar: tree-sitter-java@0.23
captures: { call: "@call", method: "@method", receiver: "@receiver", args: "@args", type: "@type" }
category: sqli
cwe: [CWE-89]
severityHint: high
api: "org.springframework.jdbc.core.JdbcTemplate#{method}(String)"
match: { receiverTypes: [JdbcTemplate, NamedParameterJdbcTemplate, JdbcOperations], receiverNamePattern: '(?i)jdbc', minArgs: 1 }
