# Velocity evaluates a template string (`Velocity.evaluate(ctx, writer, tag, template)`, `velocityEngine.evaluate(…)`).
id: java.template.velocity-evaluate
version: 1
kind: sink
lang: java
framework: template
grammar: tree-sitter-java@0.23
captures: { call: "@call", method: "@method", receiver: "@receiver", args: "@args", type: "@type" }
category: ssti
cwe: [CWE-1336]
severityHint: critical
api: "org.apache.velocity.{receiverType}#evaluate(Context, Writer, String, String)"
match: { receiverTypes: [Velocity, VelocityEngine, RuntimeInstance, RuntimeServices], receiverNamePattern: '(?i)velocity', minArgs: 4 }
