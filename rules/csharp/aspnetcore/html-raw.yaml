# Html.Raw outside Razor views.
id: csharp.aspnetcore.html-raw
version: 1
kind: sink
lang: csharp
framework: aspnetcore
grammar: tree-sitter-c-sharp@0.23
captures: { call: "@call", method: "@method", receiver: "@receiver", args: "@args", type: "@type" }
category: xss
cwe: [CWE-79]
severityHint: medium
api: "IHtmlHelper.Raw(value)"
match: { receiverTextPattern: '^Html$', minArgs: 1 }
