# FileStream / FileInfo / StreamWriter opened from a path.
id: csharp.dotnet.file-stream
version: 1
kind: sink
lang: csharp
framework: dotnet
grammar: tree-sitter-c-sharp@0.23
captures: { call: "@call", method: "@method", receiver: "@receiver", args: "@args", type: "@type" }
category: path_traversal
cwe: [CWE-22]
severityHint: high
api: "new {type}(path, …)"
match: { minArgs: 1 }
