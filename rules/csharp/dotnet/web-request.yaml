# WebRequest.Create(url).
id: csharp.dotnet.web-request
version: 1
kind: sink
lang: csharp
framework: dotnet
grammar: tree-sitter-c-sharp@0.23
captures: { call: "@call", method: "@method", receiver: "@receiver", args: "@args", type: "@type" }
category: ssrf
cwe: [CWE-918]
severityHint: medium
api: "{receiver}.{method}(url)"
match: { receiverTextPattern: '^(System\.Net\.)?(WebRequest|HttpWebRequest)$', minArgs: 1 }
