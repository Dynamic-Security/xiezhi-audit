# type-embedding formatters (BinaryFormatter, SoapFormatter, NetDataContractSerializer, LosFormatter, ObjectStateFormatter).
id: csharp.dotnet.binary-formatter
version: 1
kind: sink
lang: csharp
framework: dotnet
grammar: tree-sitter-c-sharp@0.23
captures: { call: "@call", method: "@method", receiver: "@receiver", args: "@args", type: "@type" }
category: deserialization
cwe: [CWE-502]
severityHint: critical
api: "{receiverType}.{method}(stream)"
match: { receiverTypes: [BinaryFormatter, SoapFormatter, NetDataContractSerializer, LosFormatter, ObjectStateFormatter], receiverNamePattern: '(?i)formatter' }
