# WebClient downloads / uploads.
id: csharp.dotnet.web-client
version: 1
kind: sink
lang: csharp
framework: dotnet
grammar: tree-sitter-c-sharp@0.23
captures: { call: "@call", method: "@method", receiver: "@receiver", args: "@args", type: "@type" }
category: ssrf
cwe: [CWE-918]
severityHint: medium
api: "WebClient.{method}(url)"
match: { receiverTypes: [WebClient], receiverNamePattern: '(?i)webclient|^_?wc$|^_?client$', minArgs: 1 }
