# Roslyn scripting evaluates C# source.
id: csharp.libs.roslyn-scripting
version: 1
kind: sink
lang: csharp
framework: libs
grammar: tree-sitter-c-sharp@0.23
captures: { call: "@call", method: "@method", receiver: "@receiver", args: "@args", type: "@type" }
category: code_injection
cwe: [CWE-94]
severityHint: critical
api: "CSharpScript.{method}(code)"
match: { receiverTextPattern: '^(Microsoft\.CodeAnalysis\.CSharp\.Scripting\.)?CSharpScript$', minArgs: 1 }
