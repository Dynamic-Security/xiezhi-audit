# Symfony BinaryFileResponse / AbstractController::file by path.
id: php.symfony.file-response
version: 1
kind: sink
lang: php
framework: symfony
grammar: tree-sitter-php@0.24
captures: { call: "@call", method: "@method", receiver: "@receiver", args: "@args" }
category: path_traversal
cwe: [CWE-22]
severityHint: medium
api: "{method}"
match: { notReceiverTextPattern: '^(?!\$this$).+', minArgs: 1 }
