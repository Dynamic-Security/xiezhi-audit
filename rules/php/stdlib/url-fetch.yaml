# URL wrappers and sockets: file_get_contents / fopen of an http(s) URL, get_headers, fsockopen.
id: php.ssrf.url-fetch
version: 1
kind: sink
lang: php
framework: php
grammar: tree-sitter-php@0.24
captures: { call: "@call", method: "@method", args: "@args" }
category: ssrf
cwe: [CWE-918]
severityHint: high
api: "{method}"
match: { minArgs: 1 }
