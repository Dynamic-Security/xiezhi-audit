# HTTP clients: Guzzle / Symfony HttpClient / Laravel Http facade requests.
id: php.ssrf.http-client
version: 1
kind: sink
lang: php
framework: php
grammar: tree-sitter-php@0.24
captures: { call: "@call", method: "@method", receiver: "@receiver", args: "@args" }
category: ssrf
cwe: [CWE-918]
severityHint: high
api: "{receiver}->{method}"
match: { receiverNamePattern: '(?i)client|guzzle|^\\?Http(::|$)|\$http|->http$|curl', minArgs: 1 }
