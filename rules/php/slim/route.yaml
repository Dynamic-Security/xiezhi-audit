# Slim — $app|$group->get|post|put|patch|delete|options|any|map(path, handler) with ->group('/p', fn) prefixes;
# ->add(mw) on the route, its groups and (same file) $app are middlewares; handlers 'Class:method', [Class::class, 'm'],
