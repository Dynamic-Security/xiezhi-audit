# Laravel redirects to a given URL (redirect($url), redirect()->away / to, Redirect::to / away).
id: php.laravel.redirect
version: 1
kind: sink
lang: php
framework: laravel
grammar: tree-sitter-php@0.24
captures: { call: "@call", method: "@method", receiver: "@receiver", args: "@args" }
category: open_redirect
cwe: [CWE-601]
severityHint: medium
api: "{method}"
match: { notReceiverTextPattern: '^(?!(redirect\(\)|\\?Redirect)$).+', minArgs: 1 }
