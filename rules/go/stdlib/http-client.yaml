id: go.net-http.client
version: 1
kind: sink
lang: go
framework: stdlib
grammar: tree-sitter-go@0.25
captures: { call: "@call", method: "@method", receiver: "@receiver", args: "@args" }
category: ssrf
cwe: [CWE-918]
severityHint: high
api: "net/http.{method}"
match: { requiresImportAny: [net/http], receiverImport: net/http, minArgs: 1 }
