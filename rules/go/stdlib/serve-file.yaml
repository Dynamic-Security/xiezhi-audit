id: go.net-http.serve-file
version: 1
kind: sink
lang: go
framework: stdlib
grammar: tree-sitter-go@0.25
captures: { call: "@call", method: "@method", receiver: "@receiver", args: "@args" }
category: path_traversal
cwe: [CWE-22]
severityHint: medium
api: "net/http.{method}"
match: { receiverImport: net/http, minArgs: 3 }
