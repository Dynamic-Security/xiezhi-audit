id: go.os-exec.command
version: 1
kind: sink
lang: go
framework: stdlib
grammar: tree-sitter-go@0.25
captures: { call: "@call", method: "@method", receiver: "@receiver", args: "@args" }
category: cmdi
cwe: [CWE-78]
severityHint: critical
api: "os/exec.{method}"
match: { requiresImportAny: [os/exec], receiverImport: os/exec, minArgs: 1 }
