# lark-cli (@larksuite/cli) — https://github.com/larksuite/cli ; every operation is one fixed command, no shell.
operations:
  - name: fetch_doc
    kind: read
    description: 读取一份飞书云文档或知识库页面的正文（Markdown）。doc 填文档链接（/docx/ 或 /wiki/）或 token
    command: [docs, +fetch, --doc, "{doc}", --doc-format, markdown, --as, "{as}"]
    params:
      doc: { type: string, maxLength: 2000, required: true, description: 文档链接或 token }
      as: { type: string, enum: [user, bot], default: user, description: user = 你的身份，bot = 应用身份 }
    response: { extract: "$.data.document.content", max_bytes: 262144 }

  - name: create_doc
    kind: write
    description: 新建一份飞书云文档，正文为 Markdown；结果含 document_id 与 url
    command: [docs, +create, --doc-format, markdown, --title, "{title}", --content, "-", --parent-token, "{parent_token}", --as, "{as}"]
    stdin: "{content}"
    params:
      title: { type: string, maxLength: 200, required: true }
      content: { type: string, maxLength: 262144, required: true, description: Markdown 正文 }
      parent_token: { type: string, maxLength: 200, description: 目标文件夹或知识库节点 token（不填则建在默认位置） }
      as: { type: string, enum: [user, bot], default: user }
    response: { extract: "$.data.document", max_bytes: 8192 }

  - name: overwrite_doc
    kind: write
    description: 用 Markdown 整篇覆盖一份已有的飞书云文档（同一份文档，链接不变）
    command: [docs, +update, --doc, "{doc}", --command, overwrite, --doc-format, markdown, --content, "-", --as, "{as}"]
    stdin: "{content}"
    params:
      doc: { type: string, maxLength: 2000, required: true, description: 文档链接或 token }
      content: { type: string, maxLength: 262144, required: true, description: Markdown 正文 }
      as: { type: string, enum: [user, bot], default: user }
    response: { max_bytes: 8192 }
